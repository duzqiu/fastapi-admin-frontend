# Nginx 配置模板：
# 容器启动时由官方镜像的入口脚本 envsubst 渲染成 /etc/nginx/conf.d/default.conf，
# 其中 ${API_UPSTREAM} 会被替换成环境变量 API_UPSTREAM 的值（默认 http://backend:8000）。
#
# ⚠️ 该地址在容器启动时必须能被解析，否则 nginx 会启动失败：
#    - 同一自定义网络里的服务名 / 容器名（推荐，如 backend、admin-backend）
#    - 或宿主机网关地址 host.docker.internal（需 compose 里的 extra_hosts）

# WebSocket / SSE 升级用（map 必须位于 http 层，conf.d/*.conf 正好被 include 在 http 里）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # 头像等上传文件的大小上限
    client_max_body_size 10m;

    gzip             on;
    gzip_min_length  1k;
    gzip_comp_level  5;
    gzip_vary        on;
    gzip_types       text/plain text/css application/javascript application/json image/svg+xml;

    # ===== 接口 / 上传文件 / 内置静态资源都在 /api 前缀下，一条规则全部转发给后端 =====
    # 前端构建时 VITE_API_BASE_URL=/api/v1（相对路径），浏览器只访问本机 → 天然没有跨域问题
    location /api/ {
        proxy_pass ${API_UPSTREAM};

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ===== 带内容 hash 的构建产物可以长缓存 =====
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ===== index.html 不缓存，保证发版后立刻拿到新的资源引用 =====
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ===== SPA：vue-router 用的是 history 模式，刷新或直达子路由都回退到 index.html =====
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ===== 隐藏文件不对外暴露 =====
    location ~ /\.(?!well-known) {
        deny all;
    }
}
